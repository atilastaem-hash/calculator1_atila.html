    <div class="page">
        <input type="text" value="0" class="input1" id="display" readonly>

        <button class="button1">C</button>
        <button class="button2">⌫</button>
        <button class="button3">%</button>
        <button class="button4">×</button>

        <button class="button12">+</button>

        <button class="button14">2</button>
        <button class="button15">3</button>
        <button class="button16">=</button>


        <button class="button17">0</button>
        <button class="button18">.</button>

    <div dir="rtl">
        <p>Created by Atila</p>
    </div>

    <script>
        const display = document.getElementById("display");

        function addToDisplay(value) {
            if (display.value === "Error") display.value = "0";

            if (display.value === "0" && value !== ".") {
                display.value = value;
            } else {
                display.value += value;
            }
        }

        function clearDisplay() {
            display.value = "0";
        }

        function deleteLast() {
            display.value = display.value.slice(0, -1);
            if (display.value === "" || display.value === "Error") {
                display.value = "0";
            }
        }

        function calculate() {
            try {
                const expression = display.value;

                // فقط عددها و عملگرهای ماشین‌حساب اجازه دارند.
                if (!/^[0-9+\-*/.() ]+$/.test(expression)) {
                    throw new Error("Invalid expression");
                }

                const result = Function('"use strict"; return (' + expression + ')')();

                if (!Number.isFinite(result)) {
                    throw new Error("Invalid result");
                }

                display.value = String(Number(result.toFixed(10)));
            } catch (error) {
                display.value = "Error";
            }
        }

        document.querySelector(".button1").addEventListener("click", clearDisplay);
        document.querySelector(".button2").addEventListener("click", deleteLast);
        document.querySelector(".button3").addEventListener("click", function () {
            if (display.value !== "0" && /[0-9)]$/.test(display.value)) {
                display.value += "/100";
            }
        });
        document.querySelector(".button4").addEventListener("click", () => addToDisplay("*"));
        document.querySelector(".button8").addEventListener("click", () => addToDisplay("-"));
        document.querySelector(".button12").addEventListener("click", () => addToDisplay("+"));
        document.querySelector(".button16").addEventListener("click", calculate);
        document.querySelector(".button17").addEventListener("click", () => addToDisplay("0"));
        document.querySelector(".button18").addEventListener("click", () => addToDisplay("."));

        document.querySelectorAll(
            ".button5, .button6, .button7, .button9, .button10, .button11, .button13, .button14, .button15"
        ).forEach(button => {
            button.addEventListener("click", () => addToDisplay(button.textContent.trim()));
        });
    </script>
